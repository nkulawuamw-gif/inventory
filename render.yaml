services:
  - type: web
    name: inventory-app
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py create_admin && python manage.py ensure_message_status && python manage.py collectstatic --noinput
    startCommand: daphne best_inventory_system.asgi:application --bind 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://localhost:8000
      - key: DB_DIR
        value: /var/data
      - key: DATABASE_URL
        value: postgresql://inventory_ugek_user:0V8C4IoBtmIjFIkaRXGndlCRKIVbtYr3@dpg-d84abpj7uimc739h653g-a/inventory_ugek
      - key: REDIS_URL
        value: ""
      - key: PYTHONUNBUFFERED
        value: 1
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
