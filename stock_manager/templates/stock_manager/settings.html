{% extends 'stock_manager/base.html' %}
{% block content %}

<h2 class="mb-3"><i class="bi bi-gear-wide-connected"></i> Settings</h2>

<!-- Tabs -->
<div class="d-flex gap-2 mb-4 flex-wrap">
    <button class="btn btn-primary rounded-pill px-3" onclick="showSection('company')">Company</button>
    <button class="btn btn-outline-primary rounded-pill px-3" onclick="showSection('whatsapp')">WhatsApp</button>
    <button class="btn btn-outline-primary rounded-pill px-3" onclick="showSection('periods')">Business Period</button>
    <button class="btn btn-outline-primary rounded-pill px-3" onclick="showSection('shops')">Shops</button>
    <button class="btn btn-outline-primary rounded-pill px-3" onclick="showSection('salesmen')">Salesmen</button>
    <button class="btn btn-outline-primary rounded-pill px-3" onclick="showSection('landing')">Landing</button>
</div>

<div id="settingsPage">

<!-- COMPANY -->
<div class="settings-section" id="section-company">
<div class="card">
<div class="card-header bg-dark text-white">Company Profile</div>
<div class="card-body">
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="save_company">

<input class="form-control mb-2" name="company_name" value="{{ company.company_name }}" placeholder="Company Name">
<textarea class="form-control mb-2" name="address">{{ company.address }}</textarea>

<div class="row">
<div class="col"><input class="form-control" name="phone" value="{{ company.phone }}" placeholder="Phone"></div>
<div class="col"><input class="form-control" name="email" value="{{ company.email }}" placeholder="Email"></div>
</div>

<button class="btn btn-dark w-100 mt-3">Save</button>
</form>
</div>
</div>
</div>

<!-- WHATSAPP -->
<div class="settings-section" id="section-whatsapp" style="display:none">
<div class="card">
<div class="card-header bg-success text-white">WhatsApp Settings</div>
<div class="card-body">
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="save_whatsapp">

<input class="form-control mb-2" name="phone_number" value="{{ whatsapp.phone_number }}">
<input class="form-control mb-2" name="business_name" value="{{ whatsapp.business_name }}">
<textarea class="form-control mb-2" name="greeting_message">{{ whatsapp.greeting_message }}</textarea>

<button class="btn btn-success w-100">Save</button>
</form>
</div>
</div>
</div>

<!-- PERIODS -->
<div class="settings-section" id="section-periods" style="display:none">
<div class="card">
<div class="card-header bg-primary text-white">Business Period</div>
<div class="card-body">
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="open_period">

<input class="form-control mb-2" name="name" placeholder="Period Name">
<input type="date" class="form-control mb-2" name="start_date">
<input type="date" class="form-control mb-2" name="end_date">

<button class="btn btn-primary w-100">Open Period</button>
</form>
</div>
</div>
</div>

<!-- SHOPS -->
<div class="settings-section" id="section-shops" style="display:none">
<div class="card">
<div class="card-header bg-success text-white">Shops</div>
<div class="card-body">
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="add_shop">

<input class="form-control mb-2" name="name" placeholder="Shop Name">

<button class="btn btn-success w-100">Add Shop</button>
</form>
</div>
</div>
</div>

<!-- SALESMEN -->
<div class="settings-section" id="section-salesmen" style="display:none">
<div class="card">
<div class="card-header bg-info text-white">Salesmen</div>
<div class="card-body">
<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="add_user">

<input class="form-control mb-2" name="username" placeholder="Username">
<input class="form-control mb-2" name="email" placeholder="Email">
<input class="form-control mb-2" name="password" placeholder="Password">

<button class="btn btn-info w-100">Add User</button>
</form>
</div>
</div>
</div>

<!-- LANDING -->
<div class="settings-section" id="section-landing" style="display:none">
<div class="card">
<div class="card-header bg-dark text-white">Landing Page</div>
<div class="card-body">

<form method="post">
{% csrf_token %}
<input type="hidden" name="action" value="save_landing_hero">

<input class="form-control mb-2" name="hero_title" value="{{ landing_data.hero.title }}">
<textarea class="form-control mb-2" name="hero_subtitle">{{ landing_data.hero.subtitle }}</textarea>

<button class="btn btn-dark w-100">Save Hero</button>
</form>

</div>
</div>
</div>

</div>

<!-- SAVE BAR -->
<div class="settings-save-bar">
<button class="btn btn-success w-100" onclick="saveAllSettings()">Save All Changes</button>
</div>

<!-- SCRIPT -->
<script>
function showSection(name){
document.querySelectorAll('.settings-section').forEach(e=>e.style.display='none');
document.getElementById('section-'+name).style.display='';
}

function saveAllSettings(){
const forms=document.querySelectorAll('#settingsPage form');
forms.forEach(f=>f.submit());
}
</script>

<style>
.settings-save-bar{
position:fixed;bottom:0;left:0;right:0;
background:#fff;padding:10px;border-top:1px solid #ccc;
}
</style>

{% endblock %}
