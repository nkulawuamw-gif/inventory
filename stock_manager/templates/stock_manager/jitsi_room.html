{% extends 'stock_manager/base.html' %}
{% block content %}
<style>
#jitsi-wrapper {
    position: relative; width: 100%;
    height: calc(100vh - 120px);
    border-radius: 12px; overflow: hidden;
    background: #1a1a2e;
}
#jitsi-container { width: 100%; height: 100%; }
#jitsi-container iframe { width: 100%; height: 100%; border: 0; }
.call-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px;
    background: #2c3e50; color: white;
    border-radius: 12px 12px 0 0;
    font-size: 0.85rem;
}
.call-bar .end-btn {
    background: #e74c3c; color: white; border: none;
    padding: 6px 20px; border-radius: 20px;
    font-weight: 600; cursor: pointer;
}
.call-bar .end-btn:hover { background: #c0392b; }
#jitsi-loading {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    color: white; background: #1a1a2e;
}
#jitsi-loading.hidden { display: none; }
#jitsi-error {
    position: absolute; inset: 0; z-index: 3;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 20px;
    color: white; background: #1a1a2e; text-align: center;
}
#jitsi-error.show { display: flex; }
@media (max-width: 767px) {
    #jitsi-wrapper { height: calc(100vh - 160px); }
    .call-bar { font-size: 0.75rem; padding: 6px 10px; }
    .call-bar .end-btn { padding: 4px 14px; font-size: 0.75rem; }
}
</style>

<div class="call-bar">
    <div>
        <i class="bi bi-telephone{% if call.call_type == 'video' %}-video{% endif %} me-2"></i>
        {{ other_user.get_full_name|default:other_user.username }}
        <span class="badge bg-{% if call.call_type == 'video' %}success{% else %}info{% endif %} ms-2">{{ call.get_call_type_display }}</span>
    </div>
    <div class="d-flex align-items-center gap-2">
        <span id="timer" class="small">00:00</span>
        <button class="end-btn" onclick="endCall()"><i class="bi bi-telephone-x"></i> End</button>
    </div>
</div>

<div id="jitsi-wrapper">
    <div id="jitsi-container"></div>
    <div id="jitsi-loading">
        <div class="spinner-border text-light" role="status"></div>
        <span>Connecting...</span>
    </div>
    <div id="jitsi-error">
        <i class="bi bi-exclamation-triangle" style="font-size:3rem;"></i>
        <h5>Could not connect</h5>
        <p class="text-muted" id="errorMsg">Please check your connection and try again.</p>
        <div class="d-flex gap-2 flex-wrap justify-content-center">
            <button class="btn btn-primary" onclick="location.reload()">Retry</button>
            <a href="{% url 'calls' %}" class="btn btn-outline-light">Back</a>
        </div>
    </div>
</div>

{% csrf_token %}
<script src="https://meet.jit.si/external_api.js"></script>
<script>
(function () {
    'use strict';

    var ended = false;
    var timer = null;
    var seconds = 0;
    var api = null;

    function el(id) { return document.getElementById(id); }

    function showError(msg) {
        if (msg) el('errorMsg').textContent = msg;
        el('jitsi-loading').classList.add('hidden');
        el('jitsi-error').classList.add('show');
    }

    function endCall() {
        if (ended) return;
        ended = true;
        if (timer) { clearInterval(timer); timer = null; }
        if (api) { try { api.dispose(); } catch (e) {} api = null; }

        var csrf = (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || '';
        var f = new XMLHttpRequest();
        f.open('POST', '{% url "end_call" call.id %}', false);
        f.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        f.send('csrfmiddlewaretoken=' + encodeURIComponent(csrf));

        window.location.href = '{% url "calls" %}';
    }

    function initJitsi() {
        var container = el('jitsi-container');
        if (!container) { showError('Container not found'); return; }
        container.innerHTML = '';

        try {
            api = new JitsiMeetExternalAPI('meet.jit.si', {
                roomName: 'inv_{{ call.id }}',
                parentNode: container,
                configOverrides: {
                    prejoinPageEnabled: false,
                    disableDeepLinking: true,
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    disableProfile: true,
                    enableWelcomePage: false,
                    disableInviteFunctions: true,
                    enableClosePage: false,
                },
                interfaceConfigOverrides: {
                    MOBILE_APP_PROMO: false,
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_BRAND_WATERMARK: false,
                    DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
                    HIDE_INVITE_MORE_HEADER: true,
                    TOOLBAR_ALWAYS_VISIBLE: true,
                },
                userInfo: {
                    displayName: '{{ request.user.get_full_name|default:request.user.username }}',
                },
            });
        } catch (e) {
            console.error('[Jitsi] init failed:', e);
            showError('Failed to start Jitsi: ' + (e.message || 'unknown error'));
            return;
        }

        var to = setTimeout(function () {
            console.warn('[Jitsi] timeout');
            showError('Connection timed out. Try again.');
        }, 25000);

        api.addListener('videoConferenceJoined', function () {
            console.log('[Jitsi] joined');
            clearTimeout(to);
            el('jitsi-loading').classList.add('hidden');
            timer = setInterval(function () {
                seconds++;
                var m = String(Math.floor(seconds / 60)).padStart(2, '0');
                var s = String(seconds % 60).padStart(2, '0');
                el('timer').textContent = m + ':' + s;
            }, 1000);
        });

        api.addListener('readyToClose', endCall);
        api.addListener('videoConferenceLeft', endCall);

        api.addListener('errorOccurred', function (e) {
            console.error('[Jitsi] error:', e);
        });
    }

    window.addEventListener('beforeunload', function () {
        if (!ended) {
            ended = true;
            if (api) { try { api.dispose(); } catch (e) {} }
            var csrf = (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || '';
            navigator.sendBeacon(
                '{% url "end_call" call.id %}',
                'csrfmiddlewaretoken=' + encodeURIComponent(csrf)
            );
        }
    });

    if (typeof JitsiMeetExternalAPI !== 'undefined') {
        initJitsi();
    } else {
        var check = setInterval(function () {
            if (typeof JitsiMeetExternalAPI !== 'undefined') {
                clearInterval(check);
                initJitsi();
            }
        }, 200);
        setTimeout(function () {
            clearInterval(check);
            if (!api) showError('Jitsi script failed to load. Reload to retry.');
        }, 15000);
    }
})();
</script>
{% endblock %}
