<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%; max-width: 420px;
    }
    .login-card {
      background: white; border-radius: 20px; padding: 40px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header .icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 1.6rem; color: white;
    }
    .login-header h2 { font-weight: 800; font-size: 1.4rem; color: #1a1a2e; margin-bottom: 4px; }
    .login-header p { font-size: 0.85rem; color: #888; }
    .form-floating { margin-bottom: 16px; }
    .form-floating input {
      border-radius: 12px; border: 2px solid #e0e0e0;
      padding: 16px 12px; height: auto; font-size: 0.9rem;
    }
    .form-floating input:focus {
      border-color: #e91e63; box-shadow: 0 0 0 3px rgba(233,30,99,0.1);
    }
    .form-floating label { padding: 16px 12px; color: #888; }
    .btn-login {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white; font-weight: 700; font-size: 0.95rem;
      transition: 0.3s; cursor: pointer;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,30,99,0.3); }
    .login-footer { text-align: center; margin-top: 24px; }
    .login-footer a {
      color: #888; font-size: 0.8rem; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .login-footer a:hover { color: #e91e63; }
    .alert { border-radius: 12px; font-size: 0.85rem; padding: 12px 16px; margin-bottom: 20px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.7); text-decoration: none;
      font-size: 0.85rem; margin-bottom: 20px; transition: 0.3s;
    }
    .back-link:hover { color: white; }
    .pw-toggle { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; z-index:5; color:#888; font-size:1.1rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <a href="{% url 'landing' %}" class="back-link"><i class="bi bi-arrow-left"></i> Back to Store</a>
    <div class="login-card">
      <div class="login-header">
        <div class="icon"><i class="bi bi-box-seam"></i></div>
        <h2>Staff Login</h2>
        <p><strong>{{ company.company_name|default:"Inventory Management System" }}</strong></p>
      </div>

      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-danger">
        <i class="bi bi-exclamation-triangle"></i> {{ message }}
      </div>
      {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-floating">
          <input type="text" name="username" id="id_username" class="form-control" placeholder="Username" required autofocus>
          <label for="id_username"><i class="bi bi-person"></i> Username</label>
        </div>
        <div class="form-floating position-relative">
          <input type="password" name="password" id="id_password" class="form-control" placeholder="Password" required>
          <label for="id_password"><i class="bi bi-lock"></i> Password</label>
          <span class="pw-toggle" onclick="togglePw('id_password')" style="top:50%;transform:translateY(-50%);"><i class="bi bi-eye" id="ico_id_password"></i></span>
        </div>
        <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
      </form>

      <div class="login-footer">
        <a href="{% url 'landing' %}"><i class="bi bi-shop"></i> Return to Store</a>
      </div>
    </div>
  </div>
  <script>
  function togglePw(id) {
    var input = document.getElementById(id);
    var icon = document.getElementById('ico_' + id);
    if (!input || !icon) return;
    if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { input.type = 'password'; icon.className = 'bi bi-eye'; }
  }
  </script>
</body>
</html>
