{% extends 'stock_manager/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid p-0 d-flex flex-column" style="height:calc(100vh - 56px);">
  <div class="card shadow-sm flex-grow-1 d-flex flex-column rounded-0 border-0" style="overflow:hidden;">

    <!-- HEADER: search + chat title + selected user + status -->
    <div class="card-header bg-dark text-white py-2 px-3 d-flex align-items-center gap-2" style="min-height:52px;">
      <div class="position-relative" style="min-width:200px;">
        <input type="text" id="chatUserSearch" class="form-control form-control-sm"
               placeholder="Search users..." autocomplete="off"
               oninput="onSearchInput(this.value)" onfocus="onSearchFocus()" onblur="onSearchBlur()">
        <div id="searchResults" class="position-absolute bg-white text-dark border rounded shadow-sm"
             style="top:100%;left:0;right:0;z-index:1050;max-height:300px;overflow-y:auto;display:none;"></div>
      </div>
      <span class="fw-semibold ms-2 text-truncate" id="chatHeaderChat">Chat</span>
      <span id="chatHeaderUser" class="text-info fw-bold text-truncate"></span>
      <span id="chatUserStatus" class="small text-muted"></span>
      <span id="chatConnectionStatus" class="badge bg-secondary ms-auto">Offline</span>
    </div>

    <!-- MESSAGES AREA -->
    <div id="chatMessages" class="card-body flex-grow-1 overflow-auto p-3"
         style="background:#e8ded1;">
      <div id="chatPlaceholder" class="text-center text-muted mt-5">
        <i class="bi bi-chat-dots" style="font-size:3rem;display:block;margin-bottom:12px;"></i>
        Search for a user above to start chatting
      </div>
      <div id="typingIndicator" style="display:none;">typing...</div>
    </div>

    <!-- TYPING FIELD -->
    <div id="chatFooter" class="card-footer bg-light px-3 py-2" style="display:none;">
      <form onsubmit="return sendMessage(event)">
        {% csrf_token %}
        <div class="input-group">
          <input id="messageInput" class="form-control" autocomplete="off"
                 placeholder="Type a message..." oninput="onTyping()">
          <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i></button>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentChatUserId = null;
let typingTimeout = null;
let searchBlurTimer = null;

function isConnected() {
    var cs = window.chatSocket;
    return cs && cs.readyState === WebSocket.OPEN;
}

function updateStatus() {
    var el = document.getElementById("chatConnectionStatus");
    var cs = window.chatSocket;
    if (!cs) { el.className = "badge bg-secondary ms-auto"; el.textContent = "Offline"; return; }
    if (cs.readyState === WebSocket.OPEN) {
        el.className = "badge bg-success ms-auto"; el.textContent = "Connected";
    } else if (cs.readyState === WebSocket.CONNECTING) {
        el.className = "badge bg-warning text-dark ms-auto"; el.textContent = "Connecting";
    } else {
        el.className = "badge bg-secondary ms-auto"; el.textContent = "Offline";
    }
}

/* =========================
   USER SEARCH + SELECTION
========================= */
function onSearchFocus() {
    var val = document.getElementById("chatUserSearch").value;
    onSearchInput(val);
}

function onSearchBlur() {
    searchBlurTimer = setTimeout(function() {
        document.getElementById("searchResults").style.display = "none";
    }, 200);
}

function onSearchInput(query) {
    var results = document.getElementById("searchResults");
    var q = query.toLowerCase().trim();
    fetch('/api/all-users/')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            var currentId = parseInt('{{ request.user.id }}', 10);
            var users = (d.users || []).filter(function(u) { return u.id !== currentId; });
            if (!q) {
                results.style.display = "none";
                return;
            }
            var matched = users.filter(function(u) {
                return u.full_name.toLowerCase().indexOf(q) > -1 ||
                       u.username.toLowerCase().indexOf(q) > -1;
            });
            if (!matched.length) {
                results.style.display = "none";
                return;
            }
            results.innerHTML = '';
            matched.forEach(function(u) {
                var item = document.createElement('a');
                item.href = '#';
                item.className = 'd-flex align-items-center gap-2 px-3 py-2 text-decoration-none text-dark border-bottom';
                item.innerHTML = '<i class="bi bi-person-circle fs-5"></i><span>' + escape(u.full_name || u.username) + '</span><small class="text-muted ms-auto">@' + escape(u.username) + '</small>';
                item.onclick = function(e) {
                    e.preventDefault();
                    openChat(u.id, u.full_name || u.username);
                    document.getElementById("searchResults").style.display = "none";
                    document.getElementById("chatUserSearch").value = '';
                };
                results.appendChild(item);
            });
            results.style.display = "block";
        })
        .catch(function() {});
}

/* =========================
   OPEN CHAT
========================= */
function openChat(id, name) {
    currentChatUserId = id;

    document.getElementById("chatHeaderChat").textContent = "Chat —";
    document.getElementById("chatHeaderUser").textContent = name;
    document.getElementById("chatFooter").style.display = "block";
    document.getElementById("chatPlaceholder").style.display = "none";

    if (isConnected()) {
        var cs = window.chatSocket;
        if (cs) cs.send(JSON.stringify({ type: "mark_read", sender_id: id }));
    }

    fetch('/chat/conversation/' + id + '/')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var box = document.getElementById("chatMessages");
            box.innerHTML = "";
            (data.messages || []).forEach(function(m) {
                addMessage(m.sender, m.content, m.timestamp, m.is_mine, m.id);
            });
        });
}

/* =========================
   MESSAGES
========================= */
function addMessage(sender, text, time, mine, id) {
    var box = document.getElementById("chatMessages");
    var div = document.createElement("div");
    div.className = mine ? "text-end mb-2" : "text-start mb-2";
    if (id) div.dataset.id = id;
    div.innerHTML = '<div class="d-inline-block px-3 py-2 rounded ' + (mine ? 'bg-primary text-white' : 'bg-white border') + '" style="max-width:75%;">' + escape(text) + '<br><small class="' + (mine ? 'text-white-50' : 'text-muted') + '">' + new Date(time).toLocaleTimeString() + '</small></div>';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function sendMessage(e) {
    e.preventDefault();
    var input = document.getElementById("messageInput");
    var text = input.value.trim();
    if (!text || !currentChatUserId) return;
    if (isConnected()) {
        var cs = window.chatSocket;
        if (cs) cs.send(JSON.stringify({ receiver_id: currentChatUserId, message: text }));
    }
    addMessage("You", text, new Date().toISOString(), true);
    input.value = "";
}

/* =========================
   REALTIME EVENTS
========================= */
document.addEventListener("chat-message", function(e) {
    var d = e.detail;
    if (d.sender_id === currentChatUserId) {
        addMessage(d.sender_name, d.message, d.timestamp, false, d.message_id);
    }
});

document.addEventListener("chat-typing", function(e) {
    var d = e.detail;
    var ind = document.getElementById("typingIndicator");
    if (d.user_id === currentChatUserId && d.is_typing) {
        ind.style.display = "block";
    } else {
        ind.style.display = "none";
    }
});

/* =========================
   TYPING
========================= */
function onTyping() {
    var cs = window.chatSocket;
    if (!cs || cs.readyState !== WebSocket.OPEN || !currentChatUserId) return;
    cs.send(JSON.stringify({ type: "typing", receiver_id: currentChatUserId, is_typing: true }));
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(function() {
        cs.send(JSON.stringify({ type: "typing", receiver_id: currentChatUserId, is_typing: false }));
    }, 1500);
}

/* =========================
   HELPERS
========================= */
function escape(str) {
    return (str || "").replace(/[&<>"']/g, function(m) {
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#039;" }[m];
    });
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", function() {
    updateStatus();
    setInterval(updateStatus, 3000);
});
</script>
{% endblock %}
